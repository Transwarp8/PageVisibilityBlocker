<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Page Visibility Blocker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 200px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #333;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .header {
      font-weight: 600;
      font-size: 16px;
      text-align: center;
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    
    .toggle-label {
      font-size: 14px;
    }
    
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #2196F3;
    }
    
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    
    .status {
      text-align: center;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .status.enabled {
      background-color: #e3f2fd;
      color: #1976d2;
    }
    
    .status.disabled {
      background-color: #f5f5f5;
      color: #757575;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Visibility Blocker</div>
    
    <div class="toggle-container">
      <span class="toggle-label">Block API</span>
      <label class="switch">
        <input type="checkbox" id="toggleSwitch">
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="status" id="status">Loading...</div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
