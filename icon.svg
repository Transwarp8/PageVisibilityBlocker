<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#2C5F8A"/>
    </linearGradient>
    <!-- Eye gradient -->
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F0FE"/>
      <stop offset="100%" stop-color="#A8C8ED"/>
    </linearGradient>
    <!-- Slash gradient -->
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="26" ry="26" fill="url(#bg)"/>

  <!-- Eye shape (almond/lens) -->
  <path d="M20,64 Q64,28 108,64 Q64,100 20,64 Z"
        fill="none" stroke="#E8F0FE" stroke-width="5.5"
        stroke-linejoin="round"/>

  <!-- Iris circle -->
  <circle cx="64" cy="64" r="14" fill="url(#iris)"/>

  <!-- Pupil -->
  <circle cx="64" cy="64" r="6.5" fill="#1A3A5C"/>

  <!-- Pupil highlight -->
  <circle cx="59.5" cy="60" r="2.5" fill="#FFFFFF" opacity="0.7"/>

  <!-- Diagonal slash (blocked) -->
  <line x1="30" y1="98" x2="98" y2="30"
        stroke="url(#slash)" stroke-width="9"
        stroke-linecap="round"/>

  <!-- Slash highlight for depth -->
  <line x1="31" y1="97" x2="97" y2="31"
        stroke="#FF8A80" stroke-width="3"
        stroke-linecap="round" opacity="0.4"/>
</svg>
